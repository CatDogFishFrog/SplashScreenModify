# Tests and a build on every push; a GitHub release when a "v*" tag is pushed.
#
# Every successful run publishes the "SplashScreenModify" artifact, so the latest build of a branch
# is available without logging in to GitHub through nightly.link:
#   https://nightly.link/<owner>/<repo>/workflows/ci/<branch>/SplashScreenModify.zip
# nightly.link addresses the workflow by its file name, so keep this file called ci.yml
# and the artifact name below unchanged.
name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    shell: bash

env:
  ARTIFACT_NAME: SplashScreenModify
  EXE_PATH: dist/SplashScreenModify.exe
  # The executable bundles this Python, so it is the oldest version the project supports.
  BUILD_PYTHON: "3.12"

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    # A pull request from a branch of this repository is already covered by the push run.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        id: run_tests
        run: python -m unittest discover -s tests -t . -v

      - name: Test Summary
        if: always()
        run: |
          status="${{ steps.run_tests.outcome }}"
          if [[ "$status" == "success" ]]; then
            icon="✅"
          else
            icon="❌"
          fi
          echo "### $icon Unit Tests (Python ${{ matrix.python }})" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Status:** $status" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Runner:** Windows Server (${{ runner.arch }})" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build EXE
    needs: test
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.BUILD_PYTHON }}
          cache: pip

      - name: Read the application version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # On a tag push the tag IS the version.
            ver="${GITHUB_REF_NAME#v}"
          else
            # Nightly / branch build: derive a version from the latest tag.
            # git describe gives e.g. "v1.0.1-3-gabc1234" → "1.0.1.dev3+gabc1234"
            desc="$(git describe --tags --long --match 'v[0-9]*' 2>/dev/null || echo '')"
            if [[ -n "$desc" ]]; then
              hash="${desc##*-}"
              rest="${desc%-*}"
              n="${rest##*-}"
              base="${rest%-*}"
              base="${base#v}"
              if [[ "$n" == "0" ]]; then
                ver="$base"
              else
                ver="${base}.dev${n}+${hash}"
              fi
            else
              ver="0.0.0-dev"
            fi
          fi
          sed -i "s/^__version__ = .*/__version__ = \"$ver\"/" splashmodify/__init__.py
          echo "value=$ver" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        id: deps
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Download UPX
        id: upx
        env:
          UPX_VERSION: "5.3.0"
        run: |
          curl -fsSL "https://github.com/upx/upx/releases/download/v${UPX_VERSION}/upx-${UPX_VERSION}-win64.zip" -o upx.zip
          7z x upx.zip -oupx-dir
          upx_dir="$(cygpath -w "$PWD/upx-dir/upx-${UPX_VERSION}-win64")"
          echo "dir=$upx_dir" >> "$GITHUB_OUTPUT"
          "$PWD/upx-dir/upx-${UPX_VERSION}-win64/upx.exe" --version

      - name: Build
        id: pyinstaller
        run: pyinstaller SplashScreenModify.spec --noconfirm --upx-dir "${{ steps.upx.outputs.dir }}"

      - name: Smoke test the executable
        id: smoke_test
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: python .github/scripts/smoke_test.py --version "$VERSION" "$EXE_PATH"

      - name: Upload artifact
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.EXE_PATH }}
          if-no-files-found: error

      - name: Build Summary
        if: always()
        env:
          VERSION: ${{ steps.version.outputs.value || 'unknown' }}
        run: |
          if [[ "${{ job.status }}" == "success" ]]; then
            status_icon="✅ Success"
          elif [[ "${{ job.status }}" == "cancelled" ]]; then
            status_icon="⏹️ Cancelled"
          else
            status_icon="❌ Failed"
          fi

          short_sha="$(git rev-parse --short HEAD 2>/dev/null || echo '${{ github.sha }}')"
          commit_title="$(git log -1 --pretty=%s 2>/dev/null || echo '')"
          commit_title="${commit_title//|/-}"

          if [[ -f "$EXE_PATH" ]]; then
            exe_name="$(basename "$EXE_PATH")"
            size_bytes="$(stat -c %s "$EXE_PATH")"
            size_mb="$(awk -v b="$size_bytes" 'BEGIN { printf "%.2f MB", b / 1048576 }')"
            size_info="${size_mb} (${size_bytes} bytes)"
            sha256="$(sha256sum "$EXE_PATH" | awk '{print $1}')"
          else
            exe_name="Not generated"
            size_info="N/A"
            sha256="N/A"
          fi

          step_status() {
            case "$1" in
              success) echo "✅ success" ;;
              failure) echo "❌ failure" ;;
              cancelled) echo "⏹️ cancelled" ;;
              skipped) echo "⏭️ skipped" ;;
              *) echo "$1" ;;
            esac
          }

          {
            echo "## 🚀 Build Summary"
            echo
            echo "| Parameter | Details |"
            echo "| :--- | :--- |"
            echo "| **Job Status** | $status_icon |"
            echo "| **App Version** | \`$VERSION\` |"
            echo "| **Trigger / Ref** | \`${{ github.ref_name }}\` (\`${{ github.event_name }}\`) |"
            echo "| **Commit** | [\`$short_sha\`](https://github.com/${{ github.repository }}/commit/${{ github.sha }}) - $commit_title |"
            echo "| **Actor** | @${{ github.actor }} |"
            echo "| **Executable** | \`$exe_name\` |"
            echo "| **File Size** | $size_info |"
            if [[ "$sha256" != "N/A" ]]; then
              echo "| **SHA-256** | \`$sha256\` |"
            fi
            echo
            echo "### 📦 Artifact Downloads"
            echo
            echo "- 🎯 **This specific build (direct link, no login):** [Download Artifact #${{ github.run_id }}](https://nightly.link/${{ github.repository }}/actions/runs/${{ github.run_id }}/${{ env.ARTIFACT_NAME }}.zip)"
            echo "- 📋 **GitHub Actions Run page:** [View Run #${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            if [[ "${{ github.ref_type }}" == "branch" ]]; then
              echo "- 🔄 **Latest successful on \`${{ github.ref_name }}\`:** [Download Latest \`${{ github.ref_name }}\`](https://nightly.link/${{ github.repository }}/workflows/ci/${{ github.ref_name }}/${{ env.ARTIFACT_NAME }}.zip)"
            fi
            echo
            echo "### ⚙️ Pipeline Execution"
            echo
            echo "| Pipeline Step | Outcome |"
            echo "| :--- | :--- |"
            echo "| Version Resolution | $(step_status "${{ steps.version.outcome }}") |"
            echo "| Python & Dependencies | $(step_status "${{ steps.deps.outcome }}") |"
            echo "| UPX Compressor | $(step_status "${{ steps.upx.outcome }}") |"
            echo "| PyInstaller EXE Build | $(step_status "${{ steps.pyinstaller.outcome }}") |"
            echo "| Standalone Smoke Test | $(step_status "${{ steps.smoke_test.outcome }}") |"
            echo "| Artifact Packaging & Upload | $(step_status "${{ steps.upload.outcome }}") |"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.BUILD_PYTHON }}

      - name: Prepare release notes and checksum
        env:
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python -m pip install git-cliff==2.14.2
          bash .github/scripts/release-notes.sh "$TAG" "$REPOSITORY" release-notes.md
          (cd dist && sha256sum "$(basename "$EXE_PATH")" > "$(basename "$EXE_PATH").sha256")

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            ${{ env.EXE_PATH }}
            ${{ env.EXE_PATH }}.sha256
          fail_on_unmatched_files: true
