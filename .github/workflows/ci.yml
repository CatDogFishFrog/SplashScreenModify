name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    name: Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: python -m pytest tests/ -v

  build:
    name: Build EXE
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build
        run: pyinstaller JetBrainsSplashModify.spec --noconfirm

      - name: Show build size
        run: |
          $file = Get-Item "dist\JetBrainsSplashModify.exe"
          "EXE size: {0:N2} MB" -f ($file.Length / 1MB)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: JetBrainsSplashModify
          path: dist/JetBrainsSplashModify.exe

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: JetBrainsSplashModify
          path: dist

      - name: Install git-cliff
        uses: orhun/git-cliff-action@v4
        id: changelog
        with:
          config: cliff.toml
          args: --latest --strip header

      - name: Get previous tag
        id: prev_tag
        run: |
          PREV=$(git tag --sort=-version:refname | grep '^v' | sed -n '2p')
          echo "tag=${PREV:-}" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## JetBrains Splash Modify ${{ github.ref_name }}

            **Platform:** Windows x64
            **Python:** 3.12 (bundled via PyInstaller)

            ### What's changed

            ${{ steps.changelog.outputs.content }}

            **Full changelog:** ${{ steps.prev_tag.outputs.tag && format('[{0}...{1}](https://github.com/{2}/compare/{0}...{1})', steps.prev_tag.outputs.tag, github.ref_name, github.repository) || format('[All commits up to {0}](https://github.com/{1}/commits/{0})', github.ref_name, github.repository) }}
          files: dist/JetBrainsSplashModify.exe
          generate_release_notes: false
