# git-cliff configuration: builds the user-facing part of the GitHub release notes.
# Commit conventions: docs/COMMITS.md. Release process: docs/RELEASING.md.
# https://git-cliff.org/docs/configuration

[changelog]
header = ""
# The "<!-- N -->" prefixes in group names only fix the order of the sections; they are stripped here.
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | trim_end_matches(pat=".") | upper_first }}\
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
# Every line of a commit body is parsed as a separate conventional commit,
# so one commit can carry several independent changes.
split_commits = true
protect_breaking_commits = true
commit_preprocessors = [
  # Drop the trailing pull request number that squash merges append: users do not need it.
  { pattern = '\s*\(#\d+\)\s*$', replace = "" },
]
# Only changes a user of the tool can notice are listed.
# refactor, docs, style, test, build, ci, chore and anything unconventional stay out.
commit_parsers = [
  { message = '^\w+\((ci|build|deps|docs|test|tests|release)\)!?:', skip = true },
  { message = '^\w+(\([^)]*\))?!:', group = "<!-- 0 -->Breaking changes" },
  { message = "^feat", group = "<!-- 1 -->Added" },
  { message = "^perf", group = "<!-- 2 -->Improved" },
  { message = "^fix", group = "<!-- 3 -->Fixed" },
  { message = ".*", skip = true },
]
tag_pattern = "v[0-9].*"
